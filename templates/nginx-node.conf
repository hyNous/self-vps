server {
    listen 80;
    listen [::]:80;
    server_name __NODE_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/self-vps;
        default_type text/plain;
    }

    location / {
        root /var/www/self-vps;
        index index.html;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name __NODE_DOMAIN__;

    root /var/www/self-vps;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Install as /etc/ssh/sshd_config.d/00-hynous-hardening.conf
# The 00- prefix makes these values win over 50-cloud-init.conf.
# Enable only after key-based login has been verified.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 3
